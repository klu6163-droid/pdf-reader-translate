name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Check version consistency
        run: npm run version:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        # 前端构建（不打 Tauri，不需要 Rust 工具链）
        run: npx vite build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements-release.txt
            backend/requirements-dev.txt
      - name: Prepare writable pdf2zh caches
        run: |
          mkdir -p "${RUNNER_TEMP}/pdf2zh-home/.cache/pdf2zh"
          mkdir -p "${RUNNER_TEMP}/pdf2zh-home/.cache/babeldoc"
      - name: Install deps
        working-directory: backend
        env:
          HOME: ${{ runner.temp }}/pdf2zh-home
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt pytest==8.3.3 pytest-asyncio==0.24.0
          pip check
      - name: Verify release-only imports
        working-directory: backend
        env:
          HOME: ${{ runner.temp }}/pdf2zh-home
        run: |
          python -c "import pdf2zh, babeldoc.high_level; print('pdf2zh and babeldoc imports: ok')"
      - name: Run pytest
        working-directory: backend
        env:
          HOME: ${{ runner.temp }}/pdf2zh-home
        run: pytest

  rust:
    name: Rust (cargo check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  package-windows:
    name: Windows GNU (NSIS package + smoke)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [frontend, backend, rust]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_TARGET: x86_64-pc-windows-gnu
      RUSTUP_TOOLCHAIN: 1.96.1-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.4'
          cache: 'pip'
          cache-dependency-path: backend/requirements-release.txt
      - name: Install GNU Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update
          rustup default $env:RUSTUP_TOOLCHAIN
      - name: Verify GNU build tools
        shell: pwsh
        run: |
          $hostTriple = (rustc -vV | Select-String '^host:').Line.Split(':', 2)[1].Trim()
          if ($hostTriple -ne $env:RELEASE_TARGET) {
            throw "Rust host mismatch: expected $env:RELEASE_TARGET, got $hostTriple"
          }
          foreach ($tool in @('gcc', 'as', 'dlltool', 'windres')) {
            $command = Get-Command $tool -ErrorAction Stop
            Write-Host "$tool -> $($command.Source)"
          }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-gnu
      - name: Install frontend deps
        run: npm ci
      - name: Prepare writable pdf2zh caches
        shell: pwsh
        run: |
          $cacheHome = Join-Path $env:RUNNER_TEMP 'pdf2zh-home'
          New-Item -ItemType Directory -Force -Path (Join-Path $cacheHome '.cache\pdf2zh') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $cacheHome '.cache\babeldoc') | Out-Null
      - name: Install release dependencies
        working-directory: backend
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}\pdf2zh-home
          USERPROFILE: ${{ runner.temp }}\pdf2zh-home
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt
          python -m pip check
          python -c "import pdf2zh, babeldoc.high_level; print('pdf2zh and babeldoc imports: ok')"
      - name: Check version consistency
        run: npm run version:check
      - name: Build GNU NSIS package
        env:
          HOME: ${{ runner.temp }}\pdf2zh-home
          USERPROFILE: ${{ runner.temp }}\pdf2zh-home
        run: npm run dist
      - name: Verify installed package and backend health
        shell: pwsh
        run: |
          ./scripts/verify-windows-package.ps1 -BundleDir "src-tauri/target/$env:RELEASE_TARGET/release/bundle/nsis"
      - name: Upload NSIS package and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gnu-nsis-${{ github.ref_name }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe
            ${{ runner.temp }}/pdf-reader-translate-smoke-logs/**
